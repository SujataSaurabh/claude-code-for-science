[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-for-science"
version = "0.1.0"
description = "Claude Code starter kit for scientific Python data pipelines"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["example-pipeline"]

[tool.pytest.ini_options]
testpaths = ["example-pipeline/tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.ruff.lint.per-file-ignores]
"example-pipeline/tests/**" = ["E501"]
